<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-label="Turkmen carpets are woven one knot at a time."><title>Turkmen carpets are woven one knot at a time.</title><style>
.s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.k{transform-box:fill-box;transform-origin:center;animation:knot .5s cubic-bezier(.3,1.5,.5,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes knot{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="fb" width="24" height="21" patternUnits="userSpaceOnUse"><rect x="0.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="0.0" y="9.0" width="2.5" height="2.5" fill="#E8B04B"/><rect x="0.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="3.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="3.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="6.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="6.0" y="9.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="6.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="9.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="9.0" y="6.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="9.0" y="9.0" width="2.5" height="2.5" fill="#E8B04B"/><rect x="9.0" y="12.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="9.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="12.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="12.0" y="3.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="12.0" y="6.0" width="2.5" height="2.5" fill="#E8B04B"/><rect x="12.0" y="9.0" width="2.5" height="2.5" fill="#3A2A22"/><rect x="12.0" y="12.0" width="2.5" height="2.5" fill="#E8B04B"/><rect x="12.0" y="15.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="12.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="15.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="15.0" y="6.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="15.0" y="9.0" width="2.5" height="2.5" fill="#E8B04B"/><rect x="15.0" y="12.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="15.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="18.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="18.0" y="9.0" width="2.5" height="2.5" fill="#C8372D"/><rect x="18.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="21.0" y="0.0" width="2.5" height="2.5" fill="#DB7D76"/><rect x="21.0" y="18.0" width="2.5" height="2.5" fill="#DB7D76"/></pattern></defs><rect x="0" y="0" width="1280" height="21" fill="url(#fb)"/><text x="640.0" y="70" class="s" font-size="19" fill="#1E1714" font-weight="600" text-anchor="middle" >Turkmen carpets are woven one knot at a time. I build software the same way.</text><text x="640.0" y="100" class="m" font-size="13" fill="#6B5D52" text-anchor="middle" >rooted in Turkmenistan  ◆  based in Riga  ◆  working everywhere</text></svg>