</style><rect width="1280" height="620" rx="22" fill="#0E0B10"/><rect x=".5" y=".5" width="1279" height="619" rx="22" fill="none" stroke="#2B2129"/><text x="48" y="60" class="m" font-size="14" fill="#E8B04B" font-weight="600" letter-spacing="3">CASE FILE № 01  ◆  AÝKITAP</text><text x="48" y="98" class="s" font-size="26" fill="#F3E9D7" font-weight="700" >A Turkmen-language e-book platform. Five repositories, built end to end.</text><path d="M328 243 C410 243 408 318 490 318" fill="none" stroke="#614A26" stroke-width="2" stroke-dasharray="4 6"/><text x="340" y="232" class="m" font-size="12" fill="#A89A8C" >REST + JWT</text><path d="M328 503 C410 503 408 400 490 400" fill="none" stroke="#614A26" stroke-width="2" stroke-dasharray="4 6"/><text x="340" y="492" class="m" font-size="12" fill="#A89A8C" >REST</text><path d="M952 243 C870 243 872 318 790 318" fill="none" stroke="#614A26" stroke-width="2" stroke-dasharray="4 6"/><text x="940" y="232" class="m" font-size="12" fill="#A89A8C" text-anchor="end" >admin API + WS</text><path d="M952 503 C870 503 872 400 790 400" fill="none" stroke="#614A26" stroke-width="2" stroke-dasharray="4 6"/><text x="940" y="492" class="m" font-size="12" fill="#A89A8C" text-anchor="end" >POST /tmcell</text><path d="M640 206 L640 262" fill="none" stroke="#614A26" stroke-width="2" stroke-dasharray="4 6"/><g class="up" style="animation-delay:0.2s"><rect x="48" y="183" width="280" height="130" rx="16" fill="#221715" stroke="#935B2F" stroke-width="1.2"/><text x="70" y="215" class="m" font-size="12" fill="#DB8640" font-weight="700" letter-spacing="2">MOBILE · FLUTTER</text><text x="70" y="247" class="s" font-size="22" fill="#F3E9D7" font-weight="800" >Reader app</text><text x="70" y="275" class="m" font-size="13" fill="#A89A8C" >EPUB + PDF, offline library,</text><text x="70" y="297" class="m" font-size="13" fill="#A89A8C" >streaks, phone OTP sign-in</text></g><g class="up" style="animation-delay:0.35s"><rect x="48" y="443" width="280" height="130" r