<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="168" viewBox="0 0 1280 168" role="img" aria-label="20+ apps on Google Play, 60+ public repositories, shipping since 2020"><title>20+ apps on Google Play, 60+ public repositories, shipping since 2020</title><style>
.s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.k{transform-box:fill-box;transform-origin:center;animation:knot .5s cubic-bezier(.3,1.5,.5,1) both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes knot{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1280" height="168" rx="22" fill="#0E0B10"/><rect x=".5" y=".5" width="1279" height="167" rx="22" fill="none" stroke="#2B2129"/><text x="44" y="78" class="s up" font-size="56" fill="#F3E9D7" font-weight="800" style="animation-delay:0.10s" letter-spacing="-2">20<tspan fill="#E8B04B">+</tspan></text><text x="44" y="112" class="m up" font-size="14" fill="#F3E9D7" style="animation-delay:0.20s" >apps on Google Play</text><text x="44" y="136" class="m up" font-size="12" fill="#6F6258" style="animation-delay:0.25s" >production, not demos</text><text x="300" y="78" class="s up" font-size="56" fill="#F3E9D7" font-weight="800" style="animation-delay:0.22s" letter-spacing="-2">60<tspan fill="#E8B04B">+</tspan></text><text x="300" y="112" class="m up" font-size="14" fill="#F3E9D7" style="animation-delay:0.32s" >public repositories</text><text x="300" y="136" class="m up" font-size="12" fill="#6F6258" style="animation-delay:0.37s" >dart · swift · ts · kotlin</text><rect x="252" y="80" width="8" height="8" fill="#E8B04B" transform="rotate(45 256 84)"/><text x="556" y="78" class="s up" font-size="56" fill="#F3E9D7" font-weight="800" style="animation-delay:0.34s" letter-spacing="-2">2020<tspan fill="#E8B04B"></tspan></text><text x="556" y="112" class="m up" font-size="14" fill="#F3E9D7" style="animation-delay:0.44s" >shipping since</text><text x="556" y="136" class="m up" font-size="12" fill="#6F6258" style="animation-delay:0.49s" >3 companies, 1 remote</text><rect x="508" y="80" width="8" height="8" fill="#E8B04B" transform="rotate(45 512 84)"/><text x="812" y="78" class="s up" font-size="56" fill="#F3E9D7" font-weight="800" style="animation-delay:0.46s" letter-spacing="-2">5<tspan fill="#E8B04B"></tspan></text><text x="812" y="112" class="m up" font-size="14" fill="#F3E9D7" style="animation-delay:0.56s" >platforms</text><text x="812" y="136" class="m up" font-size="12" fill="#6F6258" style="animation-delay:0.61s" >android · ios · web · macos</text><rect x="764" y="80" width="8" height="8" fill="#E8B04B" transform="rotate(45 768 84)"/><text x="1068" y="78" class="s up" font-size="56" fill="#F3E9D7" font-weight="800" style="animation-delay:0.58s" letter-spacing="-2">4<tspan fill="#E8B04B"></tspan></text><text x="1068" y="112" class="m up" font-size="14" fill="#F3E9D7" style="animation-delay:0.68s" >languages spoken</text><text x="1068" y="136" class="m up" font-size="12" fill="#6F6258" style="animation-delay:0.73s" >tk · tr · en · ru</text><rect x="1020" y="80" width="8" height="8" fill="#E8B04B" transform="rotate(45 1024 84)"/></svg>